<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Serie · Vista responsive</title><style>body{margin:0;background:#080c11;color:#d9e0e7;font:14px system-ui}header{padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:12px;background:#243020;color:#b5ed79;border:1px solid #48643b;border-radius:8px;cursor:pointer}iframe{display:block;width:390px;height:844px;border:1px solid #536071;margin:5px auto 30px;max-width:100%}p{margin:0}a{color:#b5ed79}</style></head><body><header><p>Vista de prueba · cerrá otras pestañas de Serie antes de abrirla.</p><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><a href="../">Vista completa</a></header><iframe id="phone" src="../" title="Serie en pantalla móvil"></iframe><script type="module">for(const button of document.querySelectorAll('button'))button.addEventListener('click',()=>document.getElementById('phone').style.width=`${button.dataset.width}px`);</script></body></html>
