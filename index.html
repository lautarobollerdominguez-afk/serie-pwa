<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1218">
  <meta name="description" content="Tu entrenamiento, serie a serie. Rutinas, cargas y descansos guardados en tu dispositivo.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Serie">
  <title>Serie · Tu registro de entrenamiento</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Ir al entrenamiento</a>
  <div id="app" class="app-shell">
    <main class="boot-screen" id="main"><div class="brand-word">SERIE<span>.</span></div><p>Abriendo tu registro…</p></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <noscript><p class="fatal">Activá JavaScript para usar Serie. Tus registros se guardan en este navegador.</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
